id: security-baseline
name: Security baseline
description: Secrets, authentication, input handling and logging rules every service should follow.
entries:
  - {category: rule, priority: must, stage: null, title: No secrets in code or documents, body: "Never put passwords, tokens, keys or connection strings in code, configuration files that are committed, diagrams or documents. Read them from the environment or a secrets manager and say so in the design."}
  - {category: rule, priority: must, stage: null, title: Authenticate and authorise every entry point, body: "Every API operation, queue consumer and scheduled job states who may call it and how that is enforced. No endpoint is public unless the requirements say so explicitly."}
  - {category: rule, priority: must, stage: null, title: Validate all input at the boundary, body: "Treat every external input (requests, messages, files, headers) as untrusted. Validate type, size and format at the boundary and use parameterised queries. Never build queries or commands from raw input."}
  - {category: rule, priority: must, stage: null, title: Encrypt data in transit and at rest, body: "Use TLS for every network hop and encryption at rest for every data store that holds customer or business data. State the key management approach."}
  - {category: rule, priority: should, stage: null, title: Log security-relevant events without sensitive data, body: "Log authentication, authorisation failures and administrative actions with who, what and when. Never log passwords, tokens, full card numbers or personal data."}
  - {category: rule, priority: should, stage: null, title: Least privilege for every identity, body: "Service roles, database users and pipeline credentials get only the permissions they need. Wildcard permissions need a written justification."}
  - {category: constraint, priority: must, stage: 5, title: Pipelines scan dependencies and containers, body: "The CI/CD pipeline fails the build on critical vulnerabilities found by dependency and container scanning, and on committed secrets."}
