[project]
name = "sdlc-orchestrator"
version = "0.2.0"
description = "AI-SDLC Platform — Python orchestration hub: FastAPI + LangGraph agentic pipeline, RAG, MCP client"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "asyncpg>=0.30",
    "redis>=5.2",
    "boto3>=1.35",
    "httpx>=0.28",
    "PyJWT[crypto]>=2.10",
    "mcp>=1.9",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "diagrams>=0.24",
    # Attachment context extraction: parse documents + OCR images.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.setuptools.packages.find]
# skills/ holds markdown skill packs, not Python — only app* is a package.
include = ["app*"]
