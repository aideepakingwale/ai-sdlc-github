[project]
name = "sdlc-orchestrator"
version = "0.2.0"
description = "DevMind — Python orchestration hub: FastAPI + LangGraph agentic pipeline, RAG, MCP client"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "asyncpg>=0.30",
    "redis>=5.2",
    "boto3>=1.35",
    "httpx>=0.28",
    "PyJWT[crypto]>=2.10",
    "mcp>=1.9",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "diagrams>=0.24",
    # Attachment context extraction (D-65): parse documents + OCR images.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    # Deterministic document -> clean Markdown conversion (D-112): strip Office
    # noise/markup and emit structured markdown so attachments cost far fewer tokens
    # and the model can mirror an attached format reliably.
    "mammoth>=1.8",        # .docx -> HTML (preserves headings/lists/tables)
    "markdownify>=0.13",   # HTML -> Markdown
    "openpyxl>=3.1",       # .xlsx -> Markdown tables
    "python-pptx>=1.0",    # .pptx -> Markdown (slides as sections)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.setuptools.packages.find]
# skills/ holds markdown skill packs (D-37), not Python — only app* is a package.
include = ["app*"]
