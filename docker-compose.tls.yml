# TLS overlay for local/VM deployments:
#   ./scripts/gen-selfsigned.sh
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# In cloud, prefer terminating TLS at the ALB/Ingress (see infra/k8s).
services:
  frontend:
    volumes:
      - ./infra/nginx/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    ports:
      - '3000:80'
      - '8443:443'
