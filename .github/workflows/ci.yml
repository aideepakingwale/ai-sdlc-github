name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  typescript:
    name: TS services + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  python-orchestrator:
    name: Python orchestrator (LangGraph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  containers:
    name: Container builds + compose validation
    runs-on: ubuntu-latest
    needs: [typescript, python-orchestrator]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build images
        run: |
          docker build -f infra/docker/Dockerfile.orchestrator-py -t sdlc/orchestrator:ci .
          docker build -f infra/docker/Dockerfile.ai-client -t sdlc/ai-client:ci .
          docker build -f infra/docker/Dockerfile.tools -t sdlc/tools:ci .
          docker build -f infra/docker/Dockerfile.frontend -t sdlc/frontend:ci .
