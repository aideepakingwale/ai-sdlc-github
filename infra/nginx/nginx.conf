server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'" always;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets. These must NEVER hit the SPA fallback: returning
  # index.html for a missing chunk hands the browser HTML where it expects a
  # JS module, which surfaces as "Failed to fetch dynamically imported module"
  # (e.g. the lazy-loaded mermaid chunk). A real 404 lets the app recover.
  # `expires` (not add_header) so the server-level security headers still apply.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # index.html is the chunk manifest — never cache it, or a client keeps asking
  # for asset hashes that no longer exist after a redeploy.
  location = /index.html {
    expires -1;
  }

  # SPA fallback (routes only)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # PlantUML render server: same-origin proxy so diagram <img> tags stay
  # within `img-src 'self'` and work offline/privately (no public plantuml.com).
  # Optional — the viewer degrades to source if this upstream is absent.
  location /plantuml/ {
    proxy_pass http://plantuml:8080/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  # Self-hosted draw.io visual editor: same-origin embed of the `drawio`
  # container so the WYSIWYG editor loads with NO external egress (keeps the
  # offline/air-gapped posture). draw.io needs its own permissive headers, so
  # this location deliberately does NOT inherit the strict app CSP; it may be
  # framed same-origin. Optional — the viewer falls back to source/Replace if
  # this upstream is absent.
  location /drawio/ {
    proxy_pass http://drawio:8080/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  # API + SSE proxy to the orchestrator
  location /api/ {
    proxy_pass http://orchestrator:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE: no buffering, long read timeout
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
